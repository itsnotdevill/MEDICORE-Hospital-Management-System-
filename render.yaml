# Render Blueprint for MediCore Hospital Management System (HMS)
# Single Unified Web Service Architecture (Express API + React Frontend)

services:
  - type: web
    name: medicore-hms
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 20.18.0

      - key: PORT
        value: 10000

      - key: MONGODB_URI
        value: mongodb+srv://medicore_db:medicore_dbofficial@cluster0.a9jzgrg.mongodb.net/medicore_db?retryWrites=true&w=majority

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m
